name: Local model server
description: >
  Starts an open-weights model on this runner with llama.cpp, listening on 127.0.0.1 only.
  Both downloads are pinned by SHA-256; nothing is sent anywhere, and no API key is involved.

inputs:
  port:
    description: Local port for llama-server
    default: '8080'

outputs:
  url:
    description: Base URL of the local model server
    value: http://127.0.0.1:${{ inputs.port }}

runs:
  using: composite
  steps:
    - name: Model cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/llm/model.gguf
        # Bump the suffix when the model changes. A cached file is still checked against
        # MODEL_SHA256 below, so a stale or tampered cache entry fails instead of being served.
        key: llm-qwen3-4b-instruct-2507-q4km-v1 # gitleaks:allow (a cache label, not a credential)

    - name: Install llama.cpp and model
      shell: bash
      env:
        # llama.cpp CPU build b11123 (github.com/ggml-org/llama.cpp, MIT)
        LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11123/llama-b11123-bin-ubuntu-x64.tar.gz
        LLAMA_SHA256: 004fb366d25ecebbd1fbfc02f7f463aef9aac3318e41765fba434c18d8fd553c
        # Qwen3-4B-Instruct-2507, Q4_K_M GGUF (Apache-2.0)
        MODEL_URL: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
        MODEL_SHA256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
      run: |
        set -euo pipefail
        mkdir -p ~/llm && cd ~/llm
        curl -sSfL --retry 3 -o llama.tar.gz "$LLAMA_URL"
        echo "$LLAMA_SHA256  llama.tar.gz" | sha256sum -c --quiet
        tar xzf llama.tar.gz
        if [ ! -f model.gguf ]; then
          curl -sSfL --retry 3 -o model.gguf "$MODEL_URL"
        fi
        echo "$MODEL_SHA256  model.gguf" | sha256sum -c --quiet

    - name: Start model server
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        cd ~/llm/llama-b11123
        # One request at a time with the whole CPU; 8k tokens holds the largest statement page.
        LD_LIBRARY_PATH=. nohup ./llama-server -m ~/llm/model.gguf --host 127.0.0.1 --port "$PORT" \
          -c 8192 -np 1 -t "$(nproc)" > ~/llm/server.log 2>&1 &
        for _ in $(seq 1 90); do
          if curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then echo "model server ready"; exit 0; fi
          sleep 2
        done
        tail -20 ~/llm/server.log
        exit 1
