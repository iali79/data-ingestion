name: Self-test

# Manual only. Runs the full extraction toolchain on public sample filings without contacting
# the ingest API, so it needs no identity token and no secrets. Then publishes the extracted text
# to the document corpus and reads it back, proving the save -> publish -> read loop.
on:
  workflow_dispatch:

permissions: {}

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng >/dev/null
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node dist/selftest.js
        env:
          CORPUS_OUT_DIR: corpus-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-selftest
          path: corpus-out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-corpus:
    needs: selftest
    permissions:
      contents: write
    uses: ./.github/workflows/publish-corpus.yml
    with:
      artifact-pattern: corpus-selftest

  read-back:
    needs: publish-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # No OCR tools on this runner: every document must come from the published corpus.
      - run: node dist/selftest.js --from-corpus
        env:
          CORPUS_TOKEN: ${{ github.token }}
