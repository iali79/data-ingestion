name: Extract

# Scheduled + manual only. The ingest API accepts identity tokens from exactly this workflow file
# on `main` for `schedule` / `workflow_dispatch` events, so no other trigger here would work
# even if one were added.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel jobs
        type: choice
        options: ['1', '2', '4', '8', '12', '16', '20']
        default: '20'
      kinds:
        description: Task kinds
        type: choice
        options: ['financial_statement,corporate_action_notice', 'financial_statement', 'corporate_action_notice']
        default: 'financial_statement,corporate_action_notice'
      corpus:
        description: Saved document text
        type: choice
        options: ['use', 'ignore']
        default: 'use'

permissions: {}

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          # Scheduled runs take the repository variable EXTRACT_WORKERS (raised during a backfill,
          # lowered after); a manual run takes its input.
          WORKERS: ${{ inputs.workers || vars.EXTRACT_WORKERS || '4' }}
        run: |
          case "$WORKERS" in 1|2|4|8|12|16|20) ;; *) WORKERS=4 ;; esac
          echo "shards=$(seq -s, 1 "$WORKERS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng >/dev/null

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # Docling layout + TableFormer models (hash-pinned install, checksummed weights, offline).
      - id: docling
        uses: ./.github/actions/docling

      - name: Extract
        env:
          # Stored as secrets purely so their values are masked in these public logs; neither is a
          # credential. Authentication is the job's OIDC token.
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_OIDC_AUDIENCE: ${{ secrets.INGEST_OIDC_AUDIENCE }}
          TASK_KINDS: ${{ inputs.kinds || 'financial_statement,corporate_action_notice' }}
          RUN_BUDGET_MINUTES: '330'
          # Document corpus: read saved text with this job's read-only token, save fresh text for
          # the publish job. `ignore` forces every document to be downloaded and extracted again.
          CORPUS_TOKEN: ${{ github.token }}
          CORPUS_READ: ${{ inputs.corpus == 'ignore' && '0' || '1' }}
          CORPUS_OUT_DIR: corpus-out
          DOCSTAGE_PYTHON: ${{ steps.docling.outputs.python }}
          DOCLING_MODELS: ${{ steps.docling.outputs.models }}
          DOCSTAGE_PATH: ${{ github.workspace }}/python
        run: node dist/run.js

      - name: Keep extracted text for the publish job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.shard }}
          path: corpus-out/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0 # records are already gzipped

  publish-corpus:
    needs: extract
    # Publish whatever the shards saved, even if one of them failed.
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-corpus.yml
    with:
      artifact-pattern: corpus-*
