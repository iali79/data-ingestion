name: Evaluate

# Manual only. Runs the financials pipeline over a fixed sample of filings, in parallel jobs:
#   analyse pages -> classify (keep statements and cited notes) -> cut those pages out ->
#   Docling tables (text layer, or OCR for scanned pages) -> labels and columns -> arithmetic and
#   accounting checks -> derivations
# and publishes per filing the exact JSON the ingest webhook would receive, every stage's output,
# and a report scored against a hand-typed answer key.
#
# DRY RUN: no job here has id-token permission, so none can obtain an identity the ingest API
# accepts, and the evaluation code does not import the API client. Nothing reaches the database.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Sample list
        type: choice
        options: ['samples/hpl.json', 'samples/scanned.json', 'samples/pilot.json']
        default: 'samples/hpl.json'
      jobs:
        description: Parallel jobs
        type: choice
        options: ['1', '2', '4', '6', '12', '20']
        default: '6'

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          case "$JOBS" in 1|2|4|6|12|20) ;; *) JOBS=6 ;; esac
          echo "shards=$(seq -s, 1 "$JOBS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "count=$JOBS" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng >/dev/null
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - id: docling
        uses: ./.github/actions/docling
      - name: Evaluate
        env:
          DOCSTAGE_PYTHON: ${{ steps.docling.outputs.python }}
          DOCLING_MODELS: ${{ steps.docling.outputs.models }}
          DOCSTAGE_PATH: ${{ github.workspace }}/python
          SAMPLES: ${{ inputs.samples }}
          EVAL_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node dist/evaluate.js "$SAMPLES" samples/hpl-answers.json out
      - name: Keep results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-${{ matrix.shard }}
          path: out/
          retention-days: 14

  # Every shard's payloads together: a figure printed in two filings (the current period of one,
  # the comparative of the next) must agree. Differences are listed for review; nothing is dropped.
  compare:
    needs: evaluate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evaluation-*
          path: evaluations
      - name: Compare filings
        run: node dist/crosscheck.js evaluations | tee crosscheck.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosscheck
          path: crosscheck.md
          retention-days: 14
