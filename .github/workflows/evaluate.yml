name: Evaluate

# Manual only. Runs the financials pipeline (locate statements -> local model labels rows ->
# rulebook checks -> derivations) over a fixed sample of filings, in parallel jobs, and publishes
# per filing the exact JSON the ingest webhook would receive, plus a report scored against a
# hand-typed answer key.
#
# DRY RUN: no job here has id-token permission, so none can obtain an identity the ingest API
# accepts, and the evaluation code does not import the API client. Nothing reaches the database.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Sample list
        type: choice
        options: ['samples/hpl.json']
        default: 'samples/hpl.json'
      jobs:
        description: Parallel jobs
        type: choice
        options: ['1', '2', '4', '6', '12']
        default: '6'

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          case "$JOBS" in 1|2|4|6|12) ;; *) JOBS=6 ;; esac
          echo "shards=$(seq -s, 1 "$JOBS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "count=$JOBS" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng >/dev/null
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - id: llm
        uses: ./.github/actions/llm
      - name: Evaluate
        env:
          LLM_URL: ${{ steps.llm.outputs.url }}
          CORPUS_TOKEN: ${{ github.token }}
          SAMPLES: ${{ inputs.samples }}
          EVAL_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node dist/evaluate.js "$SAMPLES" samples/hpl-answers.json out
      - name: Keep results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-${{ matrix.shard }}
          path: out/
          retention-days: 14
